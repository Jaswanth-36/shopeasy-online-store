<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - ShopEasy</title>
    <link rel="stylesheet" href="css/forgot-password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your registered email and choose a new password</p>
            
            <form id="forgotForm">
                <div class="form-group">
                    <label>Registered Email Address</label>
                    <input type="email" id="resetEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password" required>
                </div>

                <button type="submit" class="auth-submit-btn">Update Password</button>
            </form>

            <p class="auth-footer-text" style="margin-top: 15px;"><a href="login.html"><i class="fa-solid fa-arrow-left"></i> Back to Login</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
