<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopEasy</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to buy products on ShopEasy</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                
                <!-- Forgot Password Link updated to point to the separate page -->
                <div style="text-align: right; margin-bottom: 15px;">
                    <a href="forgot-password.html" style="color: #0284c7; font-size: 0.85rem; text-decoration: none;">Forgot Password?</a>
                </div>

                <button type="submit" class="auth-submit-btn">Login</button>
            </form>

            <p class="auth-footer-text">Don't have an account? <a href="signup.html">Sign Up</a></p>
            <p class="auth-footer-text" style="margin-top: 10px;"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Store</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
