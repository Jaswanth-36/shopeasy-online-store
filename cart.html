<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart & Checkout - ShopEasy</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand-name">
            <div class="shopeasy-logo-symbol">
                <div class="bag-handle"></div>
                <div class="bag-body"><span class="bag-check">✓</span></div>
            </div>
            <span class="brand-title-text">ShopEasy Cart</span>
        </a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Continue Shopping</a>
    </header>

    <main class="store-container" style="max-width: 800px; margin-top: 40px; margin-bottom: 50px;">
        <h2>Your Shopping Cart</h2>
        <div id="cartItemsContainer" style="margin-top: 20px;">
            <!-- Rendered dynamically -->
        </div>

        <!-- Shipping Address Section -->
        <div style="background: white; padding: 25px; border-radius: 12px; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
            <h3>Shipping & Contact Details</h3>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Please provide where we should deliver your order.</p>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155;">Full Name</label>
                    <input type="text" id="shippingName" placeholder="Enter your full name" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155;">Phone Number</label>
                    <input type="tel" id="shippingPhone" placeholder="Enter 10-digit mobile number" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155;">Delivery Address (Street / Area)</label>
                <input type="text" id="shippingAddress" placeholder="House No, Street Name, Landmark" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155;">City / State</label>
                    <input type="text" id="shippingCity" placeholder="City or State" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
                <div>
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #334155;">PIN Code</label>
                    <input type="text" id="shippingPin" placeholder="Postal / PIN Code" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
            </div>
        </div>

        <div class="payment-section" style="background: white; padding: 25px; border-radius: 12px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
            <h3>Select Payment Method</h3>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 15px;">Choose how you want to pay for your secure checkout.</p>
            
            <select id="paymentMethodSelect" class="category-select" onchange="togglePaymentFields()" style="width: 100%; margin-bottom: 15px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <option value="" disabled selected>-- Select Payment Option --</option>
                <option value="credit-card">Credit / Debit Card</option>
                <option value="paypal">PayPal</option>
                <option value="upi">UPI / Net Banking</option>
                <option value="cod">Cash on Delivery (COD)</option>
            </select>

            <!-- Dynamic Payment Fields Container -->
            <div id="dynamicPaymentDetails" style="margin-bottom: 20px;"></div>

            <button id="checkoutBtn" class="add-to-cart-btn" onclick="processCheckout(event)" style="background: #0284c7; color: white; width: 100%; padding: 12px; font-size: 1rem; border: none; cursor: pointer; border-radius: 6px;">
                Complete Purchase & Pay
            </button>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
