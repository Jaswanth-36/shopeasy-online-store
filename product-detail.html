<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShopEasy</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="brand-name">
            <div class="shopeasy-logo-symbol">
                <div class="bag-handle"></div>
                <div class="bag-body"><span class="bag-check">✓</span></div>
            </div>
            <span class="brand-title-text">ShopEasy</span>
        </a>
        <a href="index.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Back to Store</a>
    </header>

    <main class="store-container" style="max-width: 900px; margin-top: 40px;">
        <div id="productDetailContainer" style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; gap: 30px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <img id="detailImg" src="" alt="Product Image" style="width: 100%; height: 350px; object-fit: cover; border-radius: 8px; background: #f1f5f9;">
            </div>
            <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center;">
                <span id="detailCategory" class="product-category-tag" style="margin-bottom: 8px;">Category</span>
                <h1 id="detailTitle" style="font-size: 1.8rem; font-weight: 800; color: #0f172a; margin-bottom: 12px;">Product Title</h1>
                <div id="detailRating" class="rating-box" style="margin-bottom: 16px;">★★★★★</div>
                <div class="price-row" style="margin-bottom: 24px;">
                    <span id="detailPrice" class="product-price" style="font-size: 1.5rem;">$0.00</span>
                    <span id="detailOldPrice" class="old-price" style="font-size: 1.1rem;">$0.00</span>
                </div>
                <button id="detailAddToCartBtn" class="add-to-cart-btn" style="padding: 12px; font-size: 1rem;">Add to Cart & Buy</button>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script>
        // Extract parameters from URL and populate details page
        const params = new URLSearchParams(window.location.search);
        const title = params.get("title");
        const price = params.get("price");
        const oldPrice = params.get("oldPrice");
        const img = params.get("img");
        const category = params.get("category");

        if (title) {
            document.getElementById("detailTitle").textContent = title;
            document.getElementById("detailPrice").textContent = price;
            document.getElementById("detailOldPrice").textContent = oldPrice;
            document.getElementById("detailImg").src = img;
            document.getElementById("detailCategory").textContent = category;
            document.title = `${title} - ShopEasy`;
        }
    </script>
</body>
</html>
